name: Hourly Order Flow Scanner

on:
  schedule:
    - cron: '0 * * * *'   # runs at minute 0 of every hour (UTC)
  workflow_dispatch:        # adds a manual "Run workflow" button for testing

permissions:
  contents: write            # lets the workflow commit results back to the repo

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Run scanner
        run: python main.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scanner_F4_final_v9.csv scanner_INFLOW24_final_v9.csv scanner_report_v11.json scanner_overlaps_v11.csv
          git commit -m "Update scanner results $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push
